    const contactToggle=document.getElementById('contact-toggle'),contactCard=document.getElementById('contact-card'),contactClose=document.getElementById('contact-close'),qrButton=document.getElementById('qr-button'),qrInline=document.getElementById('qr-inline'),copyToast=document.getElementById('copy-toast');function setContact(open){contactCard.classList.toggle('open',open);contactCard.setAttribute('aria-hidden',String(!open));contactToggle.setAttribute('aria-expanded',String(open));if(open)setPanel(false)}contactToggle.addEventListener('click',()=>setContact(!contactCard.classList.contains('open')));contactClose.addEventListener('click',()=>setContact(false));qrButton.addEventListener('click',()=>{const show=!qrInline.classList.contains('show');qrInline.classList.toggle('show',show);qrButton.setAttribute('aria-expanded',String(show));qrButton.textContent=show?'收起微信二维码':'查看微信二维码'});async function copyContact(text,label){let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch(error){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();copied=document.execCommand('copy');area.remove()}copyToast.textContent=copied?`${label}已复制`:`请手动复制：${text}`;setTimeout(()=>{copyToast.textContent=''},2200)}document.querySelectorAll('.copy-button').forEach(button=>button.addEventListener('click',()=>copyContact(button.dataset.copy,button.dataset.label)));document.addEventListener('pointerdown',event=>{if(contactCard.classList.contains('open')&&!contactCard.contains(event.target)&&event.target!==contactToggle)setContact(false)});document.addEventListener('keydown',event=>{if(event.key==='Escape')setContact(false)});

eel',event=>{if(event.ctrlKey&&!mobileResume.matches){event.preventDefault();setResumeZoom(+resumeRange.value+(event.deltaY<0?5:-5))}},{passive:false});let gestureZoom=100;resumeViewport.addEventListener('gesturestart',event=>{if(mobileResume.matches)return;event.preventDefault();gestureZoom=+resumeRange.value});resumeViewport.addEventListener('gesturechange',event=>{if(mobileResume.matches)return;event.preventDefault();setResumeZoom(gestureZoom*event.scale)});let drag=null;resumeViewport.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||+resumeRange.value<=100)return;drag={x:event.clientX,y:event.clientY,left:resumeViewport.scrollLeft,top:resumeViewport.scrollTop};resumeViewport.setPointerCapture(event.pointerId);resumeViewport.classList.add('dragging')});resumeViewport.addEventListener('pointermove',event=>{if(!drag)return;resumeViewport.scrollLeft=drag.left-(event.clientX-drag.x);resumeViewport.scrollTop=drag.top-(event.clientY-drag.y)});function endDrag(){drag=null;resumeViewport.classList.remove('dragging')}resumeViewport.addEventListener('pointerup',endDrag);resumeViewport.addEventListener('pointercancel',endDrag);resumeViewport.addEventListener('dblclick',()=>{if(mobileResume.matches)return;if(+resumeRange.value===100)setResumeZoom(150);else{setResumeZoom(100);resumeViewport.scrollTo(0,0)}});window.addEventListener('resize',()=>{if(resumeDialog.open)setResumeZoom(resumeRange.value)});
    const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){document.querySelectorAll('.preview-item.active').forEach(item=>item.classList.remove('active'));document.querySelector(`.preview-item[data-page="${entry.target.id.slice(-2)}"]`)?.classList.add('active')}},{rootMargin:'-40% 0px -55%'});document.querySelectorAll('main figure').forEach(page=>observer.observe(page));
    const mobileToolsToggle=document.getElementById('mobile-tools-toggle');function setMobileTools(open){document.body.classList.toggle('mobile-tools-open',open);mobileToolsToggle.setAttribute('aria-expanded',String(open));mobileToolsToggle.textContent=open?'关闭':'功能'}mobileToolsToggle.addEventListener('click',()=>setMobileTools(!document.body.classList.contains('mobile-tools-open')));[toggle,document.getElementById('resume-toggle'),contactToggle].forEach(button=>button.addEventListener('click',()=>setMobileTools(false)));document.addEventListener('keydown',event=>{if(event.key==='Escape')setMobileTools(false)});
    const root=document.documentElement,range=document.getElementById('zoom-range'),value=document.getElementById('zoom-value'),mobilePortfolio=matchMedia('(max-width:900px)').matches;if(mobilePortfolio)range.value='100';function setZoom(next){const zoom=Math.max(+range.min,Math.min(+range.max,+next));range.value=zoom;root.style.setProperty('--portfolio-width',`${mobilePortfolio?100:zoom}%`);value.textContent=`${zoom}%`}range.addEventListener('input',()=>setZoom(range.value));document.getElementById('zoom-out').addEventListener('click',()=>setZoom(+range.value-5));document.getElementById('zoom-in').addEventListener('click',()=>setZoom(+range.value+5));setZoom(range.value);
    const scrollPet=document.getElementById('scroll-pet');let progressQueued=false;function updateProgress(){const viewport=innerHeight,pageHeight=document.documentElement.scrollHeight,max=pageHeight-viewport,progress=max>0?Math.min(1,Math.max(0,scrollY/max)):0,thumbHeight=Math.max(36,viewport*viewport/pageHeight),thumbTop=progress*(viewport-thumbHeight),petY=thumbTop+thumbHeight/2;scrollPet.style.top=`${petY}px`;scrollPet.dataset.progress=String(Math.round(progress*100));progressQueued=false}addEventListener('scroll',()=>{if(!progressQueued){progressQueued=true;requestAnimationFrame(updateProgress)}},{passive:true});addEventListener('resize',updateProgress);updateProgress();
